name: qliuyao

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: qliuyao-web:latest
    container_name: qliuyao-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # shell 环境变量优先于 .env；旧版密钥变量仍可作为回退。
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 默认值与 CLI / Web 一致；本地服务需显式配置 LLM_BASE_URL。
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      # 与 ai_interpreter.py / web/src/app/api/interpret/route.ts 的默认模型保持一致
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3000"
