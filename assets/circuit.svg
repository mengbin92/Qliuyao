<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quantum circuit">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0428"/>
      <stop offset="100%" stop-color="#1a0d33"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="600" height="280" fill="url(#bgc)"/>

  <text x="300" y="34" font-family="serif" font-size="20" fill="#ffd966"
        text-anchor="middle" letter-spacing="2">起一爻 · The Circuit</text>
  <text x="300" y="56" font-family="monospace" font-size="11" fill="#9988cc"
        text-anchor="middle">3 qubits, Hadamard each, single-shot measurement</text>

  <!-- 三条量子线 -->
  <line x1="100" y1="100" x2="540" y2="100" stroke="#a674ff" stroke-width="1.2"/>
  <line x1="100" y1="160" x2="540" y2="160" stroke="#a674ff" stroke-width="1.2"/>
  <line x1="100" y1="220" x2="540" y2="220" stroke="#a674ff" stroke-width="1.2"/>

  <!-- qubit 标签 -->
  <g font-family="monospace" font-size="14" fill="#ddd">
    <text x="50" y="105">|0⟩ q0</text>
    <text x="50" y="165">|0⟩ q1</text>
    <text x="50" y="225">|0⟩ q2</text>
  </g>

  <!-- H 门们 -->
  <g>
    <rect x="200" y="80" width="44" height="40" rx="4" fill="#ffe178" stroke="#d4a017" stroke-width="1.5"/>
    <text x="222" y="106" font-family="serif" font-size="22" font-weight="bold"
          fill="#1a0d33" text-anchor="middle">H</text>

    <rect x="200" y="140" width="44" height="40" rx="4" fill="#ffe178" stroke="#d4a017" stroke-width="1.5"/>
    <text x="222" y="166" font-family="serif" font-size="22" font-weight="bold"
          fill="#1a0d33" text-anchor="middle">H</text>

    <rect x="200" y="200" width="44" height="40" rx="4" fill="#ffe178" stroke="#d4a017" stroke-width="1.5"/>
    <text x="222" y="226" font-family="serif" font-size="22" font-weight="bold"
          fill="#1a0d33" text-anchor="middle">H</text>
  </g>

  <!-- 测量门 -->
  <g>
    <rect x="430" y="80" width="44" height="40" rx="4" fill="#a674ff" stroke="#d4a017" stroke-width="1.5"/>
    <path d="M 440,112 Q 452,90 464,112" stroke="#fff" fill="none" stroke-width="1.5"/>
    <line x1="452" y1="112" x2="466" y2="92" stroke="#fff" stroke-width="1.5"/>

    <rect x="430" y="140" width="44" height="40" rx="4" fill="#a674ff" stroke="#d4a017" stroke-width="1.5"/>
    <path d="M 440,172 Q 452,150 464,172" stroke="#fff" fill="none" stroke-width="1.5"/>
    <line x1="452" y1="172" x2="466" y2="152" stroke="#fff" stroke-width="1.5"/>

    <rect x="430" y="200" width="44" height="40" rx="4" fill="#a674ff" stroke="#d4a017" stroke-width="1.5"/>
    <path d="M 440,232 Q 452,210 464,232" stroke="#fff" fill="none" stroke-width="1.5"/>
    <line x1="452" y1="232" x2="466" y2="212" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- 阶段标注 -->
  <text x="222" y="260" font-family="serif" font-size="13" fill="#ffd966" text-anchor="middle">叠加</text>
  <text x="452" y="260" font-family="serif" font-size="13" fill="#ffd966" text-anchor="middle">坍缩</text>

  <!-- 输出状态 -->
  <g font-family="monospace" font-size="13" fill="#fff5cc">
    <text x="500" y="105">→ 0/1</text>
    <text x="500" y="165">→ 0/1</text>
    <text x="500" y="225">→ 0/1</text>
  </g>
</svg>
